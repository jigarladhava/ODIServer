<script type="text/javascript">
  RED.nodes.registerType('odi-opcua-sub', {
    category: 'ODIServer',
    color: '#2d6a7c',
    defaults: {
      name: { value: '' },
      channelId: { value: '' }
    },
    inputs: 0,
    outputs: 1,
    icon: 'bridge.svg',
    label: function () {
      return this.name || 'odi-opcua-sub ' + (this.channelId || '')
    }
  })
</script>

<script type="text/html" data-template-name="odi-opcua-sub">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>
  <div class="form-row">
    <label for="node-input-channelId"><i class="fa fa-tag"></i> Channel ID</label>
    <input type="text" id="node-input-channelId" placeholder="channel id">
  </div>
</script>

<script type="text/html" data-help-name="odi-opcua-sub">
  <p>Emits one OPC UA subscribe message per tag of the configured channel into
  the wired OpcUa-Client node at deploy time.</p>
</script>
